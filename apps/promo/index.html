<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>见客，不识客。— Jekit</title>
    <style>
        :root {
            --cyan: #6ff5ee;
            --ui: rgba(220, 245, 248, 0.72);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            background: #000;
            overflow: hidden;
            color: var(--ui);
            font-family: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        #stage {
            position: absolute;
            inset: 0;
            margin: auto;
            display: block;
            background: #000;
            cursor: pointer;
        }

        /* ---------- 开场遮罩 ---------- */

        #start {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            border: 0;
            padding: 0;
            background: radial-gradient(ellipse at center, rgba(0, 30, 34, 0.55), #000 70%);
            color: inherit;
            font: inherit;
            cursor: pointer;
            transition: opacity 0.6s ease;
            z-index: 5;
        }

        .started #start {
            opacity: 0;
            pointer-events: none;
        }

        #start .inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        #start .ring {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            border: 1px solid rgba(111, 245, 238, 0.45);
            box-shadow: 0 0 40px rgba(111, 245, 238, 0.18), inset 0 0 20px rgba(111, 245, 238, 0.1);
            animation: breathe 2s ease-in-out infinite;
        }

        #start .ring::before {
            content: "";
            margin-left: 6px;
            border-left: 22px solid var(--cyan);
            border-top: 14px solid transparent;
            border-bottom: 14px solid transparent;
            filter: drop-shadow(0 0 8px rgba(111, 245, 238, 0.7));
        }

        #start .title {
            font-size: 15px;
            letter-spacing: 0.5em;
            padding-left: 0.5em;
            opacity: 0.85;
        }

        #start .hint {
            font-size: 12px;
            letter-spacing: 0.2em;
            opacity: 0.4;
        }

        @keyframes breathe {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.85;
            }

            50% {
                transform: scale(1.06);
                opacity: 1;
            }
        }

        /* ---------- 控制条 ---------- */

        #controls {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 40px 28px 18px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
            opacity: 0;
            transition: opacity 0.35s ease;
            z-index: 4;
        }

        body:not(.playing).started #controls,
        #controls:hover {
            opacity: 1;
        }

        .hide-ui #controls,
        .hide-ui #hud {
            display: none;
        }

        #bar {
            position: relative;
            height: 18px;
            cursor: pointer;
            touch-action: none;
        }

        #bar::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 8px;
            height: 2px;
            background: rgba(255, 255, 255, 0.16);
        }

        #fill {
            position: absolute;
            left: 0;
            top: 8px;
            height: 2px;
            background: var(--cyan);
            box-shadow: 0 0 8px var(--cyan);
        }

        #marks .mark {
            position: absolute;
            top: 5px;
            width: 1px;
            height: 8px;
            background: rgba(255, 255, 255, 0.35);
        }

        .row {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 12px;
            letter-spacing: 0.08em;
        }

        #time {
            font-family: Consolas, "SF Mono", monospace;
        }

        .keys {
            opacity: 0.45;
        }

        #hud {
            position: fixed;
            top: 14px;
            left: 16px;
            font: 12px Consolas, monospace;
            opacity: 0.55;
            z-index: 4;
        }

        #error {
            position: fixed;
            inset: 0;
            margin: auto;
            width: min(720px, 90vw);
            height: fit-content;
            padding: 24px;
            border: 1px solid #f87171;
            color: #fecaca;
            background: #1a0606;
            white-space: pre-wrap;
            font: 13px/1.6 Consolas, monospace;
            z-index: 10;
        }

        .recording #stage {
            cursor: progress;
        }
    </style>
</head>

<body>
    <canvas id="stage"></canvas>

    <button id="start" type="button" aria-label="播放">
        <span class="inner">
            <span class="ring"></span>
            <span class="title">见客，不识客。</span>
            <span class="hint">建议佩戴耳机 · 全屏观看（F）</span>
        </span>
    </button>

    <div id="controls">
        <div id="bar">
            <div id="marks"></div>
            <div id="fill"></div>
        </div>
        <div class="row">
            <span><span id="time">00.00 / 35</span>　<span id="section"></span></span>
            <span class="keys">空格 播放/暂停 · ←→ ±2s · Shift+←→ 段落 · 0–6 跳段 · ,/. 逐帧 · F 全屏 · H 隐藏 · R 录制</span>
        </div>
    </div>

    <div id="hud" hidden></div>
    <pre id="error" hidden></pre>

    <script src="js/util.js"></script>
    <script src="js/score.js"></script>
    <script src="js/logo.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/gl.js"></script>
    <script src="js/film.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
