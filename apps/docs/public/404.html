<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --line-color: #707070;
            --link-color: #1a0dab;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --text-color: #e0e0e0;
                --line-color: #444444;
                --link-color: #8ab4f8;
            }
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            text-align: center;
            font-family: Times, serif;
        }

        hr {
            border: 0;
            border-top: 1px solid var(--line-color);
        }

        a {
            color: var(--link-color);
        }
    </style>
</head>

<body>
    <h1>404 Not Found</h1>
    <hr>
    <p>jekit.cn</p>
    <a href="/">return to homepage</a>
</body>

</html>
