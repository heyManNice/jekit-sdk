import groovy.json.JsonSlurper

plugins {
    id 'java'
    id "io.freefair.lombok" version "9.2.0"
    id "run.halo.plugin.devtools" version "0.8.0"
}

group 'cn.jekit.jekit'

def sdkVersion = new JsonSlurper().parseText(
    providers.fileContents(layout.projectDirectory.file('../../package.json')).asText.get()
).version
def haloRevision = providers.gradleProperty('haloRevision').get()

if (!(sdkVersion instanceof String) || !(sdkVersion ==~ /\d+\.\d+/)) {
    throw new GradleException('Root package.json version must contain exactly two numeric parts, such as 1.5')
}
if (!(haloRevision ==~ /0|[1-9]\d*/)) {
    throw new GradleException('haloRevision must be a non-negative integer without leading zeros')
}

version = "${sdkVersion}.${haloRevision}".toString()

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('run.halo.tools.platform:plugin:2.26.0')
    compileOnly 'run.halo.app:api'

    testImplementation 'run.halo.app:api'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.named('generatePluginComponentsIdx') {
    notCompatibleWithConfigurationCache('This task invokes "Task.project" at execution time, which is not supported with configuration cache.')
}

halo {
    version = '2.26'
}

tasks.register('processUiResources', Copy) {
    from project(':ui').layout.buildDirectory.dir('dist')
    into layout.buildDirectory.dir('resources/main/ui')
    dependsOn project(':ui').tasks.named('assemble')
    shouldRunAfter tasks.named('processResources')
}

tasks.register('processGreeterResources', Copy) {
    from project(':greeter').layout.buildDirectory.dir('dist')
    into layout.buildDirectory.dir('resources/main/static/greeter')
    dependsOn project(':greeter').tasks.named('assemble')
    shouldRunAfter tasks.named('processResources')
}

tasks.named('classes') {
    dependsOn tasks.named('processUiResources'), tasks.named('processGreeterResources')
}
